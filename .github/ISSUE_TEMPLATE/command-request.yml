name: Request a command
description: A PML command you need is missing from the register (or is marked not yet tested)
labels: [request]
body:
  - type: markdown
    attributes:
      value: |
        The register grows from tests in E3D. A request tells us what to test next — it is not a status change by itself.
        If you already ran the command, please open a **Test report** instead — that one can change the register today.
  - type: input
    id: command
    attributes:
      label: The command
      description: As you would type it — or the closest form you saw somewhere.
      placeholder: MIRROR PLANE E 0
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What you are trying to do
      description: One sentence is enough. This decides the priority more than anything else.
      placeholder: Flip an equipment item to face the other way without rebuilding it.
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Is it in the register already?
      options:
        - 'No — searched by command and by error text'
        - 'Yes, but marked Documented / Seen in code (not tested yet)'
        - 'Yes, but the note does not cover my case'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Your E3D version
      placeholder: AVEVA E3D Design 2.1.0.x / 3.1
    validations:
      required: false
